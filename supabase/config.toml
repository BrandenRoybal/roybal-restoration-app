# Pins per-function deploy settings so a redeploy cannot silently flip them.
#
# WHY THIS FILE EXISTS: `supabase functions deploy` defaults verify_jwt to
# TRUE when nothing pins it. On 2026-08-13 a bulk redeploy (likely the
# Supabase MCP deploy tool, same default) flipped roybal-lead and
# roybal-web-agent to true — every anonymous browser call got
# UNAUTHORIZED_NO_AUTH_HEADER, so the www quote form and the AI receptionist
# were dead until hot-fixed on 2026-08-14. With the entries below, a plain
# CLI `supabase functions deploy <slug>` keeps each function's setting; no
# --no-verify-jwt flag to remember.
#
# ⚠️ The Supabase MCP deploy tool does NOT read this file. After any MCP or
# dashboard-driven redeploy, re-check with:
#   supabase functions list --project-ref djpgvcvhvgrzgaziruze -o json
# and confirm verify_jwt is still false on every function marked below.
#
# verify_jwt=false is NOT "unprotected": each of those functions self-protects
# (CORS allowlist, honeypot, per-IP/global rate caps, spend ceiling, or its
# own secret check) — they exist to be called by anonymous browsers/webhooks.
#
# Values below mirror production as read live on 2026-08-14, minus the two
# Magicplan pins removed on 2026-09-06 (E0 / findings.json F-049): the
# integration is dead — zero callers in apps/, services/ or .github/ — yet
# magicplan-proxy ran verify_jwt=false with no auth check of any kind, so
# anyone with the URL could spend the company's MAGICPLAN_API_KEY and create
# projects in the vendor account, while magicplan-webhook ran verify_jwt=true
# and could therefore never be reached by the vendor's (JWT-less) webhook at
# all. Both function directories are deleted; the code stays in git history
# if Magicplan is ever revived.

project_id = "djpgvcvhvgrzgaziruze"

# ── Anonymous-caller functions — verify_jwt MUST stay false ──────────────

[functions.roybal-lead]
verify_jwt = false # the www quote form posts here with no session

[functions.roybal-web-agent]
verify_jwt = false # the www AI receptionist panel calls here with no session

[functions.roybal-ai-ingest]
verify_jwt = false

[functions.roybal-ai-narrative]
verify_jwt = false

[functions.roybal-voice]
verify_jwt = false

# These three were pinned true on 2026-08-14 but have run verify_jwt=false in
# production since (confirmed against the live function list 2026-09-01) — the
# pins drifted, and a plain CLI deploy honoring them would have flipped each
# one and broken its no-JWT callers. All three authenticate in-code.

[functions.roybal-ai-office]
verify_jwt = false # app sends the user's access token; the function validates it in-code (RLS still gates every read)

[functions.roybal-notify]
verify_jwt = false # Twilio webhooks (status callbacks, approve-by-text inbound SMS) post with no JWT

[functions.roybal-portal]
verify_jwt = false # customers call with a share token, no session — in-code auth

# ── Authenticated functions — verify_jwt stays true ──────────────────────

[functions.gmail-proxy]
verify_jwt = true

[functions.qb-time-proxy]
verify_jwt = true

[functions.qbo-proxy]
verify_jwt = true

[functions.roybal-brief]
verify_jwt = true
