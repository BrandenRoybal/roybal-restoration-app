name: CI

# The test gate the repo did not have. Until this existed, the only workflow was
# a deploy (deploy-field.yml) with no test step, so `main` could be — and on
# 2026-09-04 was — red and published at the same time: PR #181 bumped
# apps/field/sw.js without apps/field/js/config.js, apps/field/test/build.test.mjs
# started failing, and because the field suite is one `&&` chain that failure
# also silenced the 26 field files, the board suite and the edge-function suite
# behind it.
#
# Two rules this workflow exists to enforce:
#   1. Every suite runs on every pull request, and each suite is its own step so
#      one red suite cannot hide the others (the `&&` chain's failure mode).
#   2. The phone agent's tests run too — they are outside the root `npm test`
#      chain and have never run in CI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      # Runs first and on its own: a BUILD/CACHE drift makes every deployed
      # device report a build it is not running, which defeats the server's
      # min-build gate (supabase/migrations/218_sync_rpcs_and_build_gate.sql).
      - name: Build tag lockstep (config.js BUILD == sw.js CACHE)
        run: node apps/field/test/build.test.mjs

      - name: Field app tests
        if: '!cancelled()'
        run: npm run test --workspace=apps/field

      - name: Field app tests not in the workspace chain
        if: '!cancelled()'
        run: |
          node apps/field/test/dryingcalc.test.mjs
          node apps/field/test/sms.test.mjs
          node --test apps/field/js/calibration.test.mjs

      - name: Board tests
        if: '!cancelled()'
        run: npm run test --workspace=apps/board

      - name: Edge function tests
        if: '!cancelled()'
        run: npm run fn:test

      - name: Phone agent tests
        if: '!cancelled()'
        working-directory: services/phone-agent
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm test
