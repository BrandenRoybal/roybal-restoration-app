name: CI

# The test gate the repo did not have. Until this existed, the only workflow was
# a deploy (deploy-field.yml) with no test step, so `main` could be — and on
# 2026-09-04 was — red and published at the same time.
#
# Three rules this workflow exists to enforce:
#   1. Every suite runs on every pull request, and each suite is its own step so
#      one red suite cannot hide the others.
#   2. NOTHING SHORT-CIRCUITS INSIDE A SUITE EITHER. The first version of this
#      file ran `npm run test --workspace=apps/field`, which was a 28-file `&&`
#      chain — so the first red file still hid the 27 behind it. Every suite now
#      runs through `node --test` over a glob: each file is its own child
#      process, all of them run, and every failure is reported.
#   3. The file list is DISCOVERED, not hand-maintained. The old chain was a
#      literal list in package.json plus a second list here for the files that
#      had drifted out of it (dryingcalc, sms, calibration). A new test file
#      landing in the directory is now in CI automatically.
#
# `--test-concurrency=1` is deliberate: several suites are timing-sensitive, and
# CPU contention between parallel test processes is a flake source. These suites
# finish in well under a minute serially.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      # Runs first and on its own: a BUILD/CACHE drift makes every deployed
      # device report a build it is not running, which defeats the server's
      # min-build gate (supabase/migrations/218_sync_rpcs_and_build_gate.sql).
      - name: Build tag lockstep (config.js BUILD == sw.js CACHE)
        run: node apps/field/test/build.test.mjs

      - name: Field app tests
        if: '!cancelled()'
        run: npm run test --workspace=apps/field

      # The sync harness models the server's merge stamp, which production
      # floors at the SERVER clock. The default run skews that clock ahead of
      # the tablet, which is what the field looks like and what hid a data-loss
      # bug until 2026-09-07. This second run restores the equal-clock case, so
      # a regression that only shows when the two clocks agree still gets caught.
      - name: Field sync tests, equal-clock regime
        if: '!cancelled()'
        env:
          SYNC_SERVER_SKEW_MS: "0"
        run: node apps/field/test/sync.mjs

      - name: Board tests
        if: '!cancelled()'
        run: npm run test --workspace=apps/board

      - name: Edge function tests
        if: '!cancelled()'
        run: npm run fn:test

      - name: Phone agent tests
        if: '!cancelled()'
        working-directory: services/phone-agent
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm test
